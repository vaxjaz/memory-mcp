name: Build and distribute

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build or repair, e.g. v0.1.1; empty builds current source only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Serialize repair, tag, and release events so they cannot race asset uploads.
  group: memory-mcp-distribution
  cancel-in-progress: false

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report build started
        if: github.event_name != 'pull_request'
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=distribution \
            -f description='Testing and building offline packages' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false

      - name: Select release version and exact source tag
        id: plan
        run: python3 tooling/scripts/release.py plan

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.plan.outputs.source_ref }}
          path: source
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: source/go.sum

      - name: Test and inspect
        run: |
          python3 -m unittest discover -s tooling/scripts -p 'test_*.py'
          go -C source test -count=1 ./...
          go -C source vet ./...

      - name: Build offline packages
        env:
          BUILD_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python3 tooling/scripts/package.py --source-dir source \
            --output-dir dist --version "$BUILD_VERSION"

      - name: Verify packaged Linux executable and checksums
        env:
          BUILD_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/memory-mcp-check"
          tar -xzf dist/memory-mcp-*-linux-amd64.tar.gz -C "$RUNNER_TEMP/memory-mcp-check"
          binary=$(find "$RUNNER_TEMP/memory-mcp-check" -type f -name memory-mcp -print -quit)
          python3 tooling/scripts/smoke.py "$binary" --expected-version "$BUILD_VERSION"
          python3 tooling/scripts/check_zcode_business_flow.py "$binary" --if-supported

      - name: Save downloadable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memory-mcp-${{ steps.plan.outputs.version }}-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish or repair release assets
        if: steps.plan.outputs.publish == 'true' && github.event_name != 'pull_request'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          CREATE_TAG: ${{ steps.plan.outputs.create_tag }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          args=(--tag "$RELEASE_TAG" --dist dist --source-dir source)
          if [ "$CREATE_TAG" = true ]; then
            args+=(--create-tag --source-sha "$SOURCE_SHA")
          fi
          python3 tooling/scripts/release.py publish "${args[@]}"

      - name: Report build result
        if: always() && github.event_name != 'pull_request'
        env:
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=distribution \
            -f description="Build and distribution: $RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

