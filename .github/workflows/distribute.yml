name: Build and distribute

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report build started
        if: github.event_name != 'pull_request'
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=distribution \
            -f description='Testing and building offline packages' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: true

      - name: Test and inspect
        run: |
          go test -count=1 ./...
          go vet ./...

      - name: Build offline packages
        run: python3 scripts/package.py

      - name: Verify packaged Linux executable and checksums
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/memory-mcp-check"
          tar -xzf dist/memory-mcp-*-linux-amd64.tar.gz -C "$RUNNER_TEMP/memory-mcp-check"
          binary=$(find "$RUNNER_TEMP/memory-mcp-check" -type f -name memory-mcp -print -quit)
          python3 scripts/smoke.py "$binary"

      - name: Save downloadable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memory-mcp-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish new version to Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          version=$(python3 -c "import runpy; print(runpy.run_path('scripts/package.py')['VERSION'])")
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists; leaving published assets unchanged."
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "memory-mcp $tag" \
              --notes-file docs/RELEASE_NOTES.md
          fi

      - name: Report build result
        if: always() && github.event_name != 'pull_request'
        env:
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=distribution \
            -f description="Build and distribution: $RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
